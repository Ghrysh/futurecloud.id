version: '3.8'
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: futurecloud-app
    container_name: futurecloud-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - futurecloud
    extra_hosts:
      - "host.docker.internal:host-gateway"

  web:
    image: nginx:alpine
    container_name: futurecloud-web
    restart: unless-stopped
    ports:
      # Hanya buka port 8888 untuk diakses Apache secara internal
      # Port 80 dan 443 DIHAPUS agar tidak bentrok dengan Apache Host
      - "127.0.0.1:8888:80"
    volumes:
      - ./:/var/www
      - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      # SSL akan dihandle oleh Apache Host, jadi volume letsencrypt di sini tidak wajib
    networks:
      - futurecloud
    depends_on:
      - app

  db:
    image: postgres:15-alpine
    container_name: futurecloud-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-db_btt}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-123qwe}
    volumes:
      - dbdata:/var/lib/postgresql/data
    ports:
      - "5444:5432"
    networks:
      - futurecloud

  ollama:
    image: ollama/ollama:latest
    container_name: futurecloud-ollama
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - futurecloud

networks:
  futurecloud:
    driver: bridge

volumes:
  dbdata:
  ollama-data: