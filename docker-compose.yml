version: '3.8'
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: futurecloud-app
    container_name: futurecloud-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - futurecloud

  web:
    image: nginx:alpine
    container_name: futurecloud-web
    restart: unless-stopped
    ports:
      - "8088:80"
    volumes:
      - ./:/var/www
      - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - futurecloud
    depends_on:
      - app

  db:
    image: postgres:15-alpine
    container_name: futurecloud-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-db_btt}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-123qwe}
    volumes:
      - dbdata:/var/lib/postgresql/data
    ports:
      - "5444:5432"
    networks:
      - futurecloud

networks:
  futurecloud:
    driver: bridge

volumes:
  dbdata: